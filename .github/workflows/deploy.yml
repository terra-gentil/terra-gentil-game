name: Deploy jogo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'jogo/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Permissions minimas no top-level (build job nao precisa pages/id-token).
# Permissoes de pages/id-token sao concedidas apenas ao job de deploy.
permissions:
  contents: read

env:
  # Em junho/2026 o GitHub forca Node 24 nas actions. Opta antes pra evitar warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jogo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jogo/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jogo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
