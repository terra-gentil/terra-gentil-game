<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1B5E20" />
    <title>Gentileza: Resgate dos Jardins</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1B5E20;
      }
      #game-container canvas {
        max-width: 100%;
        max-height: 100%;
      }
      #orientation-warning {
        position: fixed;
        inset: 0;
        background: #1B5E20;
        color: #FFF;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        text-align: center;
        padding: 20px;
        font-family: system-ui, sans-serif;
        font-size: 24px;
        z-index: 1000;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #orientation-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="orientation-warning">
      <div style="font-size: 64px;">📱</div>
      <div>Gire seu celular pra jogar</div>
      <div style="font-size: 16px; opacity: 0.7;">O jogo funciona melhor em modo paisagem</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
