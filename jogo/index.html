<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1B5E20" />
    <title>Gentileza: Resgate dos Jardins</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1B5E20;
      }
      #game-container canvas {
        max-width: 100%;
        max-height: 100%;
      }
      #orientation-warning {
        position: fixed;
        inset: 0;
        background: #1B5E20;
        color: #FFF;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        text-align: center;
        padding: 20px;
        font-family: system-ui, sans-serif;
        font-size: 24px;
        z-index: 1000;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #orientation-warning {
          display: flex;
        }
      }
      #submit-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        font-family: 'Arial Black', system-ui, sans-serif;
        padding: 20px;
      }
      .submit-modal-card {
        background: #1B5E20;
        border: 4px solid #F5C97E;
        border-radius: 16px;
        padding: 32px 28px;
        max-width: 480px;
        width: 100%;
        color: #FFF;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }
      .submit-modal-title {
        font-size: 28px;
        color: #F5C97E;
        margin-bottom: 16px;
        letter-spacing: 1px;
      }
      .submit-modal-stats {
        display: flex;
        justify-content: space-around;
        margin: 12px 0 20px 0;
        font-family: Arial, sans-serif;
        font-size: 18px;
        color: #FFF;
        opacity: 0.9;
      }
      #submit-modal-input {
        width: 100%;
        padding: 14px 16px;
        font-size: 24px;
        font-family: 'Arial Black', monospace;
        text-align: center;
        background: #FFF;
        color: #000;
        border: 3px solid #F5C97E;
        border-radius: 8px;
        text-transform: uppercase;
        letter-spacing: 2px;
        outline: none;
        user-select: text;
      }
      #submit-modal-input:focus {
        border-color: #4FBA53;
      }
      .submit-modal-rules {
        font-family: Arial, sans-serif;
        font-size: 14px;
        opacity: 0.7;
        margin-top: 8px;
      }
      .submit-modal-feedback {
        min-height: 24px;
        margin: 12px 0 4px 0;
        font-family: Arial, sans-serif;
        font-size: 16px;
      }
      .submit-modal-feedback-ok { color: #4FBA53; }
      .submit-modal-feedback-err { color: #FF7043; }
      .submit-modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      .submit-modal-btn {
        flex: 1;
        padding: 16px 24px;
        font-size: 20px;
        font-family: 'Arial Black', sans-serif;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: #FFF;
        letter-spacing: 1px;
      }
      .submit-modal-btn-primary {
        background: #4FBA53;
      }
      .submit-modal-btn-primary:disabled {
        background: #2E7D32;
        opacity: 0.4;
        cursor: not-allowed;
      }
      .submit-modal-btn-secondary {
        background: #37474F;
      }
      .submit-modal-btn-secondary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="orientation-warning">
      <div style="font-size: 64px;">📱</div>
      <div>Gire seu celular pra jogar</div>
      <div style="font-size: 16px; opacity: 0.7;">O jogo funciona melhor em modo paisagem</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
